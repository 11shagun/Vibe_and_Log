{% load static %}
<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="color-scheme" content="light">
  <title>{% block title %}Vibe &amp; Log{% endblock %}</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:wght@500;600&family=Lora:wght@400;500&family=Pinyon+Script&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="{% static 'Vibe_and_Log/style.css' %}">
</head>
<body class="{% block body_class %}{% endblock %}">
  <header class="site-header">
    <a class="site-name" href="{% url 'home' %}">Vibe &amp; Log</a>
  </header>
  <main>{% block content %}{% endblock %}</main>
  <footer class="site-footer">Written slowly, with tea.</footer>
</body>
</html>
